# ---------------------------------------------------------------------------
# SebwenPOS — Docker Compose (PostgreSQL + App)
# ---------------------------------------------------------------------------
# Usage:
#   docker compose up --build        → Build and start everything
#   docker compose up -d             → Start in background
#   docker compose logs -f app       → Follow app logs
#   docker compose down              → Stop everything
#   docker compose down -v           → Stop and DELETE all data (volumes)
#
# After first boot:
#   1. The migrate container runs prisma db push (creates tables)
#   2. The app container auto-seeds data on first run
#   3. Open http://localhost:3000
#
# pgAdmin (database GUI):
#   docker compose --profile tools up -d
#   http://localhost:5050  →  admin@sebwenpos.com / admin
#
# To migrate existing SQLite data:
#   1. Copy db/custom.db into the container
#   2. Run: docker compose exec app bun run prisma/migrate-sqlite-to-pg.ts
# ---------------------------------------------------------------------------

name: sebwenpos

services:
  # ── PostgreSQL Database ─────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: sebwenpos-db
    restart: unless-stopped
    environment:
      TZ: America/Bogota
      # PGTZ: timezone de sesión por defecto — coherente con la app para que
      # NOW()/to_timestamp() y las comparaciones de fechas usen la misma zona.
      PGTZ: America/Bogota
      POSTGRES_USER: sebwenpos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sebwenpos_secret_2025}
      POSTGRES_DB: sebwenpos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sebwenpos"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Database Migration (one-shot init container) ────────────────────────
  # Uses the "deps" build stage which has full node_modules (including
  # the prisma CLI and all its transitive dependencies like "effect").
  # Runs prisma db push, then exits. The app waits for this to succeed.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: deps
    container_name: sebwenpos-migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://sebwenpos:${POSTGRES_PASSWORD:-sebwenpos_secret_2025}@postgres:5432/sebwenpos?schema=public
    command: ["/bin/bash", "/app/docker-migrate.sh"]

  # ── Tables Real-Time Sync (Socket.IO) ───────────────────────────────────
  # WebSocket server that syncs table/session/comanda changes across all
  # connected employees in a store. The Next.js app sends HTTP broadcasts
  # to port 3006, which are then forwarded to frontend clients via
  # Socket.IO on port 3005.
  tables-sync:
    build:
      context: .
      dockerfile: mini-services/tables-sync/Dockerfile
    container_name: sebwenpos-tables-sync
    restart: unless-stopped
    environment:
      TZ: America/Bogota
    ports:
      - "3005:3005"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3006/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Next.js Application ────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sebwenpos-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # ── Timezone: los rangos de fecha de la UI (informes, cierres, ledger)
      # se parsean en la zona del server — sin esto, el contenedor en UTC
      # movía las ventas de la noche al día siguiente y las excluía. ──
      TZ: America/Bogota
      # ── Database (PostgreSQL) ──
      DATABASE_URL: postgresql://sebwenpos:${POSTGRES_PASSWORD:-sebwenpos_secret_2025}@postgres:5432/sebwenpos?schema=public
      # ── Auth ──
      AUTH_SECRET: ${AUTH_SECRET:-sebwen-auth-secret-key-2025-secure}
      INTERNAL_SECRET: ${INTERNAL_SECRET:-sebwen-internal-secret-2025}
      # ── App URL ──
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      # ── Email ──
      SMTP_FROM: ${SMTP_FROM:-noreply@sebwenpos.com}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      # ── Alerts ──
      ALERT_API_BASE: ${ALERT_API_BASE:-http://localhost:3010}
      # ── Wompi Payment Gateway ──
      WOMPI_ENV: ${WOMPI_ENV:-demo}
      WOMPI_PUBLIC_KEY: ${WOMPI_PUBLIC_KEY:-}
      WOMPI_PRIVATE_KEY: ${WOMPI_PRIVATE_KEY:-}
      WOMPI_WEBHOOK_SECRET: ${WOMPI_WEBHOOK_SECRET:-}
      NEXT_PUBLIC_WOMPI_PUBLIC_KEY: ${NEXT_PUBLIC_WOMPI_PUBLIC_KEY:-}
      # ── Super Admin (seeds on first run) ──
      SUPERADMIN_CEDULA: ${SUPERADMIN_CEDULA:-}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-}
      SUPERADMIN_NAME: ${SUPERADMIN_NAME:-}
      # ── AI Chat Provider (priority: Gemini → Z.ai gateway → ZhipuAI direct) ──
      # Provider 1 (primary): Google AI Studio / Gemini
      # Get your key at https://aistudio.google.com/apikey
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      # Provider 2: Z.ai Gateway (sandbox/dev only — unreachable from Docker)
      ZAI_BASE_URL: ${ZAI_BASE_URL:-}
      ZAI_API_KEY: ${ZAI_API_KEY:-Z.ai}
      ZAI_CHAT_ID: ${ZAI_CHAT_ID:-}
      ZAI_USER_ID: ${ZAI_USER_ID:-}
      ZAI_TOKEN: ${ZAI_TOKEN:-}
      # Provider 3: ZhipuAI Direct API (works in Docker — needs credits)
      # Get your key at https://open.bigmodel.cn/ → add credits
      GLM_API_KEY: ${GLM_API_KEY:-}
      AI_MAX_CONTEXT_MESSAGES: ${AI_MAX_CONTEXT_MESSAGES:-20}
      # ── Tables Real-Time Sync ──
      TABLES_SYNC_URL: http://tables-sync:3006
      NEXT_PUBLIC_TABLES_SYNC_URL: http://localhost:3005
    depends_on:
      migrate:
        condition: service_completed_successfully
      tables-sync:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  # ── Subscription Cron (expiry transitions + reminder emails) ───────────
  # Daily: transitions TRIAL/ACTIVE subscriptions to PAST_DUE/EXPIRED and
  # sends 3-day/1-day expiry reminders. Every 30s: auto-approves pending
  # Wompi demo transactions. Delegates all DB writes to the app's own
  # Prisma-based endpoints (dialect-agnostic — works with this Postgres setup).
  subscription-cron:
    build:
      context: .
      dockerfile: mini-services/subscription-cron/Dockerfile
    container_name: sebwenpos-subscription-cron
    restart: unless-stopped
    environment:
      TZ: America/Bogota
      INTERNAL_SECRET: ${INTERNAL_SECRET:-sebwen-internal-secret-2025}
      APP_BASE_URL: http://app:3000
      ALERT_API_BASE: http://app:3000/api/subscription/alerts
      CRON_PORT: 3010
    ports:
      - "3010:3010"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3010/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── pgAdmin (Database GUI) ─────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sebwenpos-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@sebwenpos.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools

# ── Volumes ───────────────────────────────────────────────────────────────
volumes:
  pgdata:
    driver: local
  uploads:
    driver: local
