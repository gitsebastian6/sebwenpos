# ---------------------------------------------------------------------------
# VentifyPOS — Docker Compose (PostgreSQL + App)
# ---------------------------------------------------------------------------
# Usage:
#   docker compose up --build        → Build and start everything
#   docker compose up -d             → Start in background
#   docker compose logs -f app       → Follow app logs
#   docker compose down              → Stop everything
#   docker compose down -v           → Stop and DELETE all data (volumes)
#
# After first boot:
#   1. The migrate container runs prisma db push (creates tables)
#   2. The app container auto-seeds data on first run
#   3. Open http://localhost:3000
#
# pgAdmin (database GUI):
#   docker compose --profile tools up -d
#   http://localhost:5050  →  admin@ventifypos.com / admin
#
# To migrate existing SQLite data:
#   1. Copy db/custom.db into the container
#   2. Run: docker compose exec app bun run prisma/migrate-sqlite-to-pg.ts
# ---------------------------------------------------------------------------

services:
  # ── PostgreSQL Database ─────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ventifypos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ventifypos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ventifypos_secret_2025}
      POSTGRES_DB: ventifypos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ventifypos"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Database Migration (one-shot init container) ────────────────────────
  # Uses the "deps" build stage which has full node_modules (including
  # the prisma CLI and all its transitive dependencies like "effect").
  # Runs prisma db push, then exits. The app waits for this to succeed.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: deps
    container_name: ventifypos-migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ventifypos:${POSTGRES_PASSWORD:-ventifypos_secret_2025}@postgres:5432/ventifypos?schema=public
    command: ["node", "./node_modules/prisma/build/index.js", "db", "push", "--accept-data-loss"]

  # ── Next.js Application ────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ventifypos-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # ── Database (PostgreSQL) ──
      DATABASE_URL: postgresql://ventifypos:${POSTGRES_PASSWORD:-ventifypos_secret_2025}@postgres:5432/ventifypos?schema=public
      # ── Auth ──
      AUTH_SECRET: ${AUTH_SECRET:-ventify-auth-secret-key-2025-secure}
      INTERNAL_SECRET: ${INTERNAL_SECRET:-ventify-internal-secret-2025}
      # ── App URL ──
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      # ── Email ──
      SMTP_FROM: ${SMTP_FROM:-noreply@ventifypos.com}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      # ── Alerts ──
      ALERT_API_BASE: ${ALERT_API_BASE:-http://localhost:3010}
      # ── Wompi Payment Gateway ──
      WOMPI_ENV: ${WOMPI_ENV:-demo}
      WOMPI_PUBLIC_KEY: ${WOMPI_PUBLIC_KEY:-}
      WOMPI_PRIVATE_KEY: ${WOMPI_PRIVATE_KEY:-}
      WOMPI_WEBHOOK_SECRET: ${WOMPI_WEBHOOK_SECRET:-}
      NEXT_PUBLIC_WOMPI_PUBLIC_KEY: ${NEXT_PUBLIC_WOMPI_PUBLIC_KEY:-}
      # ── Super Admin (seeds on first run) ──
      SUPERADMIN_CEDULA: ${SUPERADMIN_CEDULA:-}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-}
      SUPERADMIN_NAME: ${SUPERADMIN_NAME:-}
      # ── AI Chat Provider (GLM via Z.ai Gateway) ──
      ZAI_BASE_URL: ${ZAI_BASE_URL:-http://172.25.136.193:8080/v1}
      ZAI_API_KEY: ${ZAI_API_KEY:-Z.ai}
      ZAI_CHAT_ID: ${ZAI_CHAT_ID:-}
      ZAI_USER_ID: ${ZAI_USER_ID:-}
      ZAI_TOKEN: ${ZAI_TOKEN:-}
      AI_MAX_CONTEXT_MESSAGES: ${AI_MAX_CONTEXT_MESSAGES:-20}
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  # ── pgAdmin (Database GUI) ─────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ventifypos-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@ventifypos.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools

# ── Volumes ───────────────────────────────────────────────────────────────
volumes:
  pgdata:
    driver: local
  uploads:
    driver: local
